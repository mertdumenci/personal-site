<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ocean Study — Mert Dumenci</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="wave-lab.css">
</head>
<body>
    <canvas class="study-canvas" aria-hidden="true"></canvas>

    <main class="study-copy">
        <p class="eyebrow">Generative study <span class="counter"></span></p>
        <h1 class="study-title"></h1>
        <p class="study-description"></p>
        <p class="study-metrics" aria-live="polite"></p>
    </main>

    <nav class="study-controls" aria-label="Visualization studies">
        <button class="arrow previous" type="button" aria-label="Previous study">←</button>
        <div class="study-options"></div>
        <button class="arrow next" type="button" aria-label="Next study">→</button>
    </nav>

    <script src="wave-lab.js" defer></script>
</body>
</html>
